<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} — MinkNote</title>
  <meta name="description" content="{{ page.description | default: page.title }}" />
  <link rel="canonical" href="{{ site.url }}{{ page.url }}" />

  <meta property="og:title" content="{{ page.title }} — MinkNote" />
  <meta property="og:description" content="{{ page.description | default: page.title }}" />
  <meta property="og:type" content="article" />
  <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
  <meta property="og:site_name" content="MinkNote" />
  <meta property="og:image" content="{{ site.url }}/apps/minknote/images/hero.png" />
  {% if page.date %}
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}" />
  {% endif %}
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ page.title }} — MinkNote" />
  <meta name="twitter:description" content="{{ page.description | default: page.title }}" />
  <meta name="twitter:image" content="{{ site.url }}/apps/minknote/images/hero.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/apps/minknote/assets/css/style.css" />
  <link rel="stylesheet" href="/apps/minknote/assets/css/docs.css" />
  <link rel="stylesheet" href="/apps/minknote/assets/css/blog.css" />
  <script src="/assets/js/mixpanel.js"></script>
  <script src="/apps/minknote/assets/js/partials.js"></script>
</head>
<body class="blog-body">
  <mn-nav></mn-nav>

  <main class="blog-post">
    <div class="container blog-post-inner">
      <nav class="docs-breadcrumb" aria-label="Breadcrumb">
        <a href="/apps/minknote/blog/">Blog</a>
        <span aria-hidden="true">/</span>
        <span>{{ page.title }}</span>
      </nav>

      <article class="docs-article">
        {% if page.date %}
        <time class="blog-post-date" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%-d %B %Y" }}</time>
        {% endif %}
        <h1>{{ page.title }}</h1>
        <div class="docs-prose">
          {{ content }}
        </div>
      </article>
    </div>
  </main>

  <mn-footer></mn-footer>
  <script src="/apps/minknote/assets/js/main.js"></script>
</body>
</html>
